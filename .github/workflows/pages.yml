# Publishes both static sites in this repository to GitHub Pages as one site:
#   flashcards/  ->  /            (unchanged location, keeps the installed PWA working)
#   site/        ->  /pdir/       (PDIR General Trading website)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['flashcards/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/pdir
          cp -r flashcards/. _site/
          cp -r site/. _site/pdir/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
