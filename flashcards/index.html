<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEE9DF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B2632" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cards">
  <title>Cards – spaced repetition</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 4h11a2 2 0 0 1 2 2v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></symbol>
  </svg>

  <header class="topbar">
    <button id="btn-back" class="icon-btn hidden" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <h1 id="title">Decks</h1>
    <div class="spacer"></div>
    <button id="btn-undo" class="icon-btn hidden" aria-label="Undo last answer" disabled><svg><use href="#i-undo"/></svg></button>
    <button id="btn-help" class="icon-btn" aria-label="Help" data-i18n-label="app.help"><svg><use href="#i-help"/></svg></button>
    <button id="btn-more" class="icon-btn hidden" aria-label="More"><svg><use href="#i-more"/></svg></button>
    <button id="btn-settings" class="icon-btn" aria-label="Settings" data-i18n-label="app.settings"><svg><use href="#i-gear"/></svg></button>
  </header>
  <div id="study-progress" class="progress hidden"><div id="study-progress-bar"></div></div>

  <main id="main">
    <!-- Deck list -->
    <section id="view-decks" class="view">
      <div class="hero" id="hero">
        <div class="hero-main">
          <div class="hero-label" data-i18n="hero.due">Due today</div>
          <div class="hero-number" id="hero-due">0</div>
          <div class="hero-sub" id="hero-sub"></div>
        </div>
        <div class="hero-side">
          <div><strong id="hero-done">0</strong><span data-i18n="hero.reviewed">reviewed today</span></div>
          <div><strong id="hero-streak">0</strong><span data-i18n="hero.streak">day streak</span></div>
        </div>
      </div>

      <div class="panel" id="deck-panel">
        <div class="section-head"><h2><svg class="sh-ico"><use href="#i-cards"/></svg><span data-i18n="decks.title">Decks</span></h2><span class="muted" id="deck-summary"></span></div>
        <div id="deck-list" class="deck-list"></div>
      </div>

      <div id="empty-state" class="empty hidden">
        <div class="empty-art"><svg><use href="#i-cards"/></svg></div>
        <h3 data-i18n="empty.title">No decks yet</h3>
        <p class="muted" data-i18n-html="empty.text"></p>
        <button class="btn link" id="btn-empty-help" data-i18n="empty.help">How do I get a deck from Anki?</button>
      </div>

      <label class="btn primary big fab" id="btn-import-label">
        <svg class="ico"><use href="#i-import"/></svg> <span data-i18n="btn.import">Import deck (.apkg)</span>
        <input id="file-apkg" type="file" accept=".apkg,.zip,application/zip,application/octet-stream" hidden>
      </label>
      <input id="file-backup" type="file" accept=".zip,application/zip" hidden>
      <p id="import-status" class="status hidden" aria-live="polite"></p>
    </section>

    <!-- Deck overview -->
    <section id="view-deck" class="view hidden">
      <div class="card-panel">
        <h2 id="deck-name" class="deck-title"></h2>
        <p class="muted" id="deck-total"></p>
        <div class="ring-row">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="52" class="ring-bg"/>
            <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"/>
            <text x="60" y="56" class="ring-num" id="ring-pct">0%</text>
            <text x="60" y="76" class="ring-lbl" data-i18n="deck.learned">learned</text>
          </svg>
          <div class="counts">
            <div class="count new"><span class="n" id="c-new">0</span><small data-i18n="count.new">New</small></div>
            <div class="count learn"><span class="n" id="c-learn">0</span><small data-i18n="count.learn">Learning</small></div>
            <div class="count due"><span class="n" id="c-due">0</span><small data-i18n="count.due">To review</small></div>
          </div>
        </div>
      </div>

      <div class="card-panel">
        <div class="section-head"><h3><svg class="sh-ico"><use href="#i-check"/></svg><span data-i18n="deck.last7">Last 7 days</span></h3><span class="muted" id="hist-total"></span></div>
        <div class="hist" id="hist"></div>
      </div>

      <button id="btn-study" class="btn primary big" data-i18n="btn.study">Study now</button>
      <div class="row">
        <button id="btn-deck-export" class="btn" data-i18n="btn.export_deck">Export .apkg</button>
        <button id="btn-deck-delete" class="btn danger" data-i18n="btn.delete_deck">Delete deck</button>
      </div>
    </section>

    <!-- Study -->
    <section id="view-study" class="view hidden">
      <div class="study-head">
        <span class="pill new"><i></i><b id="s-new">0</b> <span data-i18n="study.new">new</span></span>
        <span class="pill learn"><i></i><b id="s-learn">0</b> <span data-i18n="study.learn">learning</span></span>
        <span class="pill due"><i></i><b id="s-due">0</b> <span data-i18n="study.due">review</span></span>
      </div>
      <div id="card-wrap" class="card-wrap">
        <div id="card-host" class="card-host" tabindex="0" role="button" aria-label="Show answer"></div>
        <div class="card-hint" id="card-hint"></div>
      </div>
      <div class="study-controls">
        <button id="btn-show" class="btn primary big"><span data-i18n="btn.show">Show answer</span> <kbd>space</kbd></button>
        <div id="grade" class="grade hidden">
          <button data-grade="1" class="btn again"><span data-i18n="grade.again">Again</span><small id="iv-1"></small></button>
          <button data-grade="2" class="btn hard"><span data-i18n="grade.hard">Hard</span><small id="iv-2"></small></button>
          <button data-grade="3" class="btn good"><span data-i18n="grade.good">Good</span><small id="iv-3"></small></button>
          <button data-grade="4" class="btn easy"><span data-i18n="grade.easy">Easy</span><small id="iv-4"></small></button>
        </div>
      </div>
      <div id="study-done" class="done hidden">
        <div class="done-art"><svg><use href="#i-check"/></svg></div>
        <h2 data-i18n="done.title">Session complete</h2>
        <p class="muted" id="study-done-msg"></p>
        <div class="summary">
          <div><strong id="sum-count">0</strong><span data-i18n="done.cards">cards</span></div>
          <div><strong id="sum-acc">0%</strong><span data-i18n="done.correct">correct</span></div>
          <div><strong id="sum-time">0m</strong><span data-i18n="done.time">time</span></div>
        </div>
        <button id="btn-done-back" class="btn primary big" data-i18n="btn.back_to_decks">Back to decks</button>
      </div>
    </section>

    <!-- Settings -->
    <section id="view-settings" class="view hidden">
      <div class="group">
        <div class="group-title" data-i18n="set.limits">Daily limits</div>
        <label class="field"><span data-i18n="set.new_per_day">New cards per day</span><input id="set-new-per-day" type="number" inputmode="numeric" min="0" max="9999"></label>
        <label class="field"><span data-i18n="set.rev_per_day">Maximum reviews per day</span><input id="set-rev-per-day" type="number" inputmode="numeric" min="0" max="99999"></label>
      </div>
      <div class="group">
        <div class="group-title" data-i18n="set.learning">Learning</div>
        <label class="field"><span data-i18n="set.steps">Learning steps (minutes)</span><input id="set-steps" type="text" placeholder="1, 10"></label>
      </div>
      <div class="group">
        <div class="group-title" data-i18n="set.appearance">Appearance</div>
        <label class="field"><span data-i18n="set.theme">Theme</span>
          <select id="set-theme"><option value="auto" data-i18n="set.theme_auto">System</option><option value="light" data-i18n="set.theme_light">Light</option><option value="dark" data-i18n="set.theme_dark">Dark</option></select>
        </label>
        <label class="field"><span data-i18n="set.language">Language</span>
          <select id="set-lang"><option value="auto" data-i18n="set.lang_auto">Automatic</option><option value="en">English</option><option value="pl">Polski</option></select>
        </label>
      </div>
      <button id="btn-settings-save" class="btn primary big" data-i18n="btn.save">Save</button>

      <div class="group">
        <div class="group-title" data-i18n="set.data">Data</div>
        <button id="btn-export" class="btn row-btn" data-i18n="btn.backup">Back up everything (.zip)</button>
        <button id="btn-restore" class="btn row-btn" data-i18n="btn.restore">Restore from backup…</button>
        <button id="btn-persist" class="btn row-btn" data-i18n="btn.persist">Request persistent storage</button>
        <p class="muted small" id="storage-info">…</p>
      </div>
      <div class="group">
        <div class="group-title" data-i18n="app.help">Help</div>
        <button id="btn-settings-help" class="btn row-btn" data-i18n="empty.help">How do I get a deck from Anki?</button>
      </div>
      <div class="group">
        <div class="group-title" data-i18n="set.danger">Danger zone</div>
        <button id="btn-wipe" class="btn row-btn danger" data-i18n="btn.wipe">Delete all data on this device</button>
      </div>
      <p class="muted small center" id="settings-footer"></p>
    </section>

    <!-- Help -->
    <section id="view-help" class="view hidden">
      <article id="help-body" class="help"></article>
    </section>
  </main>

  <!-- More menu (deck list) -->
  <div id="sheet" class="sheet hidden" role="dialog">
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet-body">
      <div class="sheet-grip"></div>
      <button id="sheet-backup" class="btn row-btn" data-i18n="btn.backup">Back up everything (.zip)</button>
      <button id="sheet-restore" class="btn row-btn" data-i18n="btn.restore">Restore from backup…</button>
      <button id="sheet-cancel" class="btn row-btn" data-i18n="btn.cancel">Cancel</button>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay hidden"><div data-i18n="drop.hint">Drop the .apkg file to import</div></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/sql-wasm.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
